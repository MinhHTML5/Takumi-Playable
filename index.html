<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Mobile portrait: lock the viewport to device width, no user zoom, so the
         720x1280 design canvas letterboxes cleanly under Scale.FIT (R7). -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>BlockDrop 2</title>
    <style>
      /* Fill the viewport with a dark backdrop; the FIT letterbox bars inherit
         this colour so the neon canvas reads as centered in portrait. */
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #000;
        overflow: hidden;
      }
      #game {
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <!-- Phaser mounts its canvas inside this element (see main.js `parent`). -->
    <div id="game"></div>

    <!-- Pinned Phaser 3.80.0 runtime, vendored locally for offline-runnable
         play (T4). Must load before the module below so the `Phaser` global is
         defined when main.js runs. -->
    <script src="./vendor/phaser.min.js"></script>

    <!-- Game entry point. ES module so scenes/config import cleanly. -->
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
